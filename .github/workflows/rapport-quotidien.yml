name: Rapport quotidien

on:
  schedule:
    - cron: "0 10 * * 1-5"   # du lundi au vendredi, 10 h UTC (6 h à Montréal l'été, 5 h l'hiver)
  workflow_dispatch:          # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write    # enregistrer l'historique des conformes
  pages: write       # publier le rapport
  id-token: write

concurrency:
  group: rapport
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Récupérer la mémoire de la rotation
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: memoire-${{ github.run_id }}
          restore-keys: memoire-

      - name: Analyse
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python analyse.py

      - name: Sauvegarder la mémoire de la rotation
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/cache
          key: memoire-${{ github.run_id }}

      - name: Enregistrer l'historique
        run: |
          git config user.name "rapport-bot"
          git config user.email "rapport-bot@users.noreply.github.com"
          git add data/historique data/sic.json
          git diff --cached --quiet || git commit -m "Analyse du $(date -u +%Y-%m-%d)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploiement
        uses: actions/deploy-pages@v4
